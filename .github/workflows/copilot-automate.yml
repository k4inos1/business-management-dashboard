name: 🤖 Copilot Auto-Label & PR Summary

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  auto-label:
    name: 🏷️ Auto Label PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v44

      - name: Apply labels based on changed files
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const files = `${{ steps.changed-files.outputs.all_changed_files }}`.split(' ');
            const labels = new Set();

            for (const file of files) {
              if (file.includes('pages/') || file.includes('layouts/') || file.includes('.css')) {
                labels.add('ui');
              }
              if (file.includes('data/') || file.includes('App.tsx')) {
                labels.add('business-logic');
              }
              if (file.includes('test') || file.includes('spec')) {
                labels.add('testing');
              }
              if (file.includes('README') || file.includes('.md')) {
                labels.add('documentation');
              }
              if (file.includes('workflow') || file.includes('github')) {
                labels.add('ci/cd');
              }
            }

            if (labels.size > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: Array.from(labels),
              });
            }

  pr-summary:
    name: 📝 Post PR Summary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files count
        id: changed-files
        uses: tj-actions/changed-files@v44

      - name: Post summary comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const changedFiles = `${{ steps.changed-files.outputs.all_changed_files }}`.split(' ').filter(Boolean);
            const added = `${{ steps.changed-files.outputs.added_files }}`.split(' ').filter(Boolean);
            const modified = `${{ steps.changed-files.outputs.modified_files }}`.split(' ').filter(Boolean);

            const body = [
              '## 🤖 Copilot PR Analysis',
              '',
              '| Metric | Value |',
              '|--------|-------|',
              `| Changed files | ${changedFiles.length} |`,
              `| New files | ${added.length} |`,
              `| Modified files | ${modified.length} |`,
              '',
              '### 📁 Changed Files',
              ...changedFiles.slice(0, 20).map(f => `- \`${f}\``),
              changedFiles.length > 20 ? `\n_... and ${changedFiles.length - 20} more files_` : '',
              '',
              '### ✅ Copilot Commands Available',
              '```',
              '@copilot review: ui                # Review UI changes',
              '@copilot check: types              # TypeScript check',
              '@copilot suggest: ux-improvements  # UX suggestions',
              '```',
              '',
              '_🚀 Auto-generated by InsightFlow AI PR automation_',
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
